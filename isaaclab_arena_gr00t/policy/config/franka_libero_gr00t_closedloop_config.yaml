# Config for Gr00tLiberoClosedloopPolicy on the Franka LIBERO Abs-IK Arena environment
# (external_environments/libero). This is the eef-pose counterpart of the joint-space
# gr1_manip_*_gr00t_closedloop_config.yaml files.
#
# The LIBERO `rel_rotvec` checkpoint (embodiment_tag new_embodiment) uses:
#   - video keys : agentview_cam, eye_in_hand_cam  (== the env's RGB camera obs terms)
#   - state keys : franka_eef_pose (pos3 + rotvec3), franka_gripper_pos (first finger)
#   - action keys: franka_eef_pose (ABSOLUTE pos3 + rotvec3, relative->absolute decoded inside
#                  the GR00T processor), franka_gripper_pos
# The policy converts these to the env's 8-D Abs-IK action (pos3 + quat_xyzw4 + gripper1).

# Point this at the rel_rotvec LIBERO checkpoint. Host path shown; inside the Arena GR00T
# container the same checkpoint is typically mounted at /models/checkpoint-10000.
model_path: /home/rebeccaz/Projects/gr00t_n16/gr00t/libero_all_suites_rel_rotvec/checkpoint-10000

# Fallback only: the `libero` task supplies the per-task language instruction automatically.
language_instruction: ""

embodiment_tag: NEW_EMBODIMENT

# Action horizon predicted per inference (delta_indices 0..15 in the checkpoint -> 16).
action_horizon: 16
# Actions executed per inference rollout (<= action_horizon).
action_chunk_length: 16

# Arena `libero` env observation layout (franka_libero_rl_env_cfg::RLObservationsCfg):
#   - `policy` group concatenates [eef_pose(7=pos3+quat_xyzw4), gripper_pos(2 fingers)].
#   - `rgb_camera` group holds the per-camera RGB images (concatenate_terms=False).
state_obs_group_key: policy
camera_obs_group_key: rgb_camera
# Empty -> identity: the env camera obs term name equals the GR00T video modality key.
camera_obs_to_video_key: {}

task_mode_name: franka_libero_manipulation
